# Local monitoring stack: the API, Prometheus (with alert rules) and Grafana.
#   docker compose up --build
#   API http://localhost:3000 · Prometheus http://localhost:9090 · Grafana http://localhost:3030
# Rehearse an incident: CHAOS_ERROR_RATE=0.2 docker compose up -d api
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
    ports: ["3000:3000"]
    environment:
      CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-0}
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./ops/prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bookings-api.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3030:3000"]
    depends_on: [prometheus]
