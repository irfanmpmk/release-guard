groups:
  - name: bookings-api
    rules:
      - alert: ApiDown
        expr: up{job="bookings-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Bookings API is not responding to scrapes
          runbook: Check the container status and the last deploy; roll back with scripts/deploy.sh <previous image>.

      # More than 5% of requests failing with 5xx over 5 minutes.
      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{job="bookings-api", status_code=~"5.."}[5m]))
            /
          sum(rate(http_request_duration_seconds_count{job="bookings-api"}[5m]))
            > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of Bookings API requests are failing
          runbook: Compare with the deploy time on the dashboard; if it started with a release, roll back.

      # p95 latency above 500 ms (the same budget the smoke tests use).
      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="bookings-api", route!="/metrics"}[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Bookings API p95 latency is above 500 ms
          runbook: Check the latency panel by route, then database and host load.
